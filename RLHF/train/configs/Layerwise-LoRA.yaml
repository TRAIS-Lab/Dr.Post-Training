# Layer-wise data curation with LoRA
# Exact scoring — compression adds overhead for LoRA's small dims.
method: Layerwise
finetuning: LoRA
lora_r: 16
lora_alpha: 32

score_grad_compression:
  sparsifier: none
  projector: none

# Curation fraction: keep top fraction of samples per layer (1.0 = keep all)
filter_frac: 1.0

# Validation: where the target gradient comes from
#   n_val: 0       -> self-referencing (use training rollout)
#   n_val: 1024    -> held-out validation set
n_val: 0
val_batch_size: 256

# Target function: what loss to compute the validation gradient on
#   seqloss-reward -> avg reward: -E[log pi(y|x) * normalize(R)]
#   tokenpg        -> pre-clip PG: -E[sum_t(log_prob_t * A_t)]
#   ppo            -> full PPO loss (n_val=0 only)
val_loss_type: seqloss-reward
