# BlockWiseSubset with MeSO fine-tuning, compressed 64x64: one cell of the QA
# fine-tuning-method x scoring-backend x partition matrix (launched by SFT/train/qa_matrix_task.sh). Same learning rate,
# LoRA / MeSO knobs, k = n/2 and 16 target examples as the other configs of this directory.
method: BlockWiseSubset
finetuning: MeSO
learning_rate: 5.00e-05
scoring:
  method: compress
  compression: normal-64*64
optimizer:
  compression: normal-512*512
