# GlobalSubset data curation with full fine-tuning — eot variant: <|im_end|> row initialised from <|endoftext|> before SFT (2026-09-11)
method: GlobalSubset
finetuning: Full
learning_rate: 1.00e-05
record_selections: true
subset_mode: one_pass

scoring:
  method: reduced_ghost

# Stop-token initialisation (needs SFT/train/train_v2.sh)
init_eot_from_eos: true
