# LayerWiseSubset, one-pass rollout filtering with the in-run cross-validation target refreshed every round
# (64 prompts x 8 rollouts), 80 rounds.
method: LayerWiseSubset
finetuning: Full
selection_frac: 1.0
keep_zero_adv: true
val_loss_type: reward
refresh_freq: 1
hook_embeddings: true
total_training_steps: 80
exp_suffix: _keepzero
