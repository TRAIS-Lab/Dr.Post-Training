# nq_open -> SQuAD closed-book (no context) QA
# NQ-open factoid Q->A train pool, eval on SQuAD validation with context stripped.
# Cross-distribution: NQ Google-search-style Q -> SQuAD reading-comprehension Q
# (typically context-dependent). Closed-book SQuAD is intrinsically harder than
# the standard with-context setting; many SQuAD questions lack a unique answer
# without context.
model: meta-llama/Llama-3.2-1B
train_dataset: nq_open
target_task: squad
# pct=0.1 ≈ 8800 NQ samples; with bs=8 1 epoch → 1100 main steps (matches triviaqa_nq budget)
percentage: 0.1

seed: 42
batch_size: 8
gradient_accumulation_steps: 1
optim: adamw_torch
max_seq_length: 512
lr_scheduler_type: linear
warmup_ratio: 0.03
weight_decay: 0.0
num_train_epochs: 1
# eval_steps = 11 -> ~100 ppl points across 1100 steps
eval_steps: 11
use_flash_attention: true

n_eval: 500

selection_frac: 0.5
selection_mode: topk
n_val: 16
val_batch_size: 1
val_strategy: merged_batch
scoring:
  method: reduced_ghost
