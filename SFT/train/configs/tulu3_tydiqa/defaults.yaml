# Shared experiment defaults for tulu3 → tydiqa
#
# These values are inherited by all method configs in this directory.
# Method configs can override any value.

# Model
model: meta-llama/Llama-3.2-1B

# Dataset
train_dataset: tulu3
target_task: tydiqa
percentage: 0.01

# Training
seed: 42
batch_size: 8
gradient_accumulation_steps: 1
optim: adamw_torch
max_seq_length: 512
lr_scheduler_type: linear
warmup_ratio: 0.03
weight_decay: 0.0
num_train_epochs: 1
eval_steps: 12
use_flash_attention: true

# Evaluation
n_eval: 500

# Curation defaults (used by Layerwise/Subset methods)
selection_frac: 0.5
selection_mode: topk
n_val: 16
val_batch_size: 1
val_strategy: merged_batch
scoring:
  method: ghost
