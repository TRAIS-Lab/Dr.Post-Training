# Shared experiment defaults for MATH GRPO training
#
# These values are inherited by all method configs in this directory.
# Method configs can override any value.

# Model
model: Qwen/Qwen3-1.7B-Base

# Training
seed: 42
train_batch_size: 128
max_prompt_length: 1024
max_response_length: 2048
learning_rate: 1e-6
total_epochs: 3
ppo_mini_batch_size: 32
ppo_micro_batch_size_per_gpu: 2
kl_loss_coef: 0.001
rollout_n: 8
gpu_memory_utilization: 0.6
# Loss aggregation (verl actor.loss_agg_mode). seq-mean-token-mean: every response is
# one item — per-sample gradients are gradients of per-response token-mean losses, the
# validation target is the mean over validation responses and the curated update is the
# plain mean over the kept responses (paper convention). token-mean (verl default) is the
# legacy behaviour, where samples are weighted by response length in scores and updates.
loss_agg_mode: seq-mean-token-mean

# Evaluation & checkpointing
test_freq: 3
save_freq: 1000

# Curation defaults (used by LayerWiseSubset/GlobalSubset methods)
# Selection mode is negative filtering (hardcoded in dp_actor_selection.py):
#   frac=1.0 → drop ALL negative-influence samples (keep only positive)
#   frac=0.5 → drop 50% of negative-influence samples
#   frac=0.0 → keep all samples (no filtering)
selection_frac: 1.0
val_pool_size: -1
val_batch_size: 64
val_loss_type: reward
val_source: from_train
refresh_freq: 1
