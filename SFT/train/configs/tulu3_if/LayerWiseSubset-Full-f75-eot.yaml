# LayerWiseSubset curation, top-k keeping 6 of 8 candidates per step — eot variant: <|im_end|> row initialised from <|endoftext|> before SFT (2026-09-11)
method: LayerWiseSubset
finetuning: Full
learning_rate: 1.00e-05
selection_frac: 0.75
selection_mode: topk
record_selections: true

scoring:
  method: reduced_ghost

# Stop-token initialisation (needs SFT/train/train_v2.sh)
init_eot_from_eos: true
