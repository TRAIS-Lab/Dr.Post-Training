# GlobalSubset curation, top-k keeping 6 of 8 candidates; <|im_end|> row initialised from <|endoftext|> before SFT
method: GlobalSubset
finetuning: Full
learning_rate: 1.00e-05
selection_frac: 0.75
selection_mode: topk
record_selections: true
subset_mode: one_pass

scoring:
  method: pip

# Stop-token initialisation (init_eot_from_eos is forwarded by SFT/train/train.sh)
init_eot_from_eos: true
