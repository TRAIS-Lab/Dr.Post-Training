# Layerwise data curation with MeSO optimizer
# Same sparsifier in both sections → compressor objects are shared (zero overhead)
# See configs/README.md for compression format details (LoGra, GraSS, etc.)
method: Layerwise
finetuning: MeSO

score_grad_compression:
  sparsifier: normal-512*512
  projector: none

opt_grad_compression:
  sparsifier: normal-512*512
  projector: none

# Curation fraction: keep top fraction of samples per layer (default: 0.5)
selection_frac: 0.5

# Number of held-out validation samples for computing the target gradient.
# Unlike RLHF, SFT always uses a held-out set (no self-referencing mode).
n_val: 8
val_batch_size: 1
val_strategy: merged_batch
