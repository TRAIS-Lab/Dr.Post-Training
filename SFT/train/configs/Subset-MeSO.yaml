# Subset selection with MeSO optimizer
# Subset uses exact (full-gradient) scoring; MeSO compresses only optimizer updates.
# See configs/README.md for compression format details (LoGra, GraSS, etc.)
method: Subset
finetuning: MeSO

score_grad_compression:
  sparsifier: none
  projector: none

opt_grad_compression:
  sparsifier: normal-512*512
  projector: none
