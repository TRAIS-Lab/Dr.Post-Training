hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - data.train_files=data/deepscaler.parquet
    - data.val_files=data/deepscaler.parquet
    - data.train_batch_size=512
    - data.val_batch_size=512
    - data.max_prompt_length=1024
    - data.max_response_length=3072
    - +data.mu=2
    - +data.ref_size=256
    - +data.tau=1e-3
    - +data.alpha=0.5
    - +data.sigma=0.5
    - +data.buffer_size=512
    - +data.replay_strategy=random
    - actor_rollout_ref.model.path=Qwen/Qwen2.5-Math-1.5B
    - actor_rollout_ref.actor.optim.lr=1e-6
    - actor_rollout_ref.model.use_remove_padding=True
    - actor_rollout_ref.actor.ppo_mini_batch_size=64
    - actor_rollout_ref.actor.use_dynamic_bsz=True
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=11264
    - actor_rollout_ref.actor.use_kl_loss=True
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.actor.kl_loss_coef=0
    - actor_rollout_ref.actor.kl_loss_type=low_var_kl
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.grad_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - +actor_rollout_ref.actor.use_temp_log_prob=True
    - actor_rollout_ref.rollout.name=vllm
    - actor_rollout_ref.rollout.temperature=0.6
    - actor_rollout_ref.rollout.val_temperature=0.6
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.7
    - actor_rollout_ref.rollout.n=8
    - actor_rollout_ref.rollout.n_val=8
    - trainer.critic_warmup=0
    - trainer.logger=[console,wandb]
    - trainer.project_name=rl
    - trainer.experiment_name=replay_prob_temp_random_teacher_model_Qwen2.5-Math-1.5B_dataset_deepscaler_epoch_30_bs_512_lr_1e-6_beta_0_entropy_0_mu_2_tau_1e-3_alpha_0.5_sigma_0.5_buffer_512
    - +trainer.val_before_train=False
    - trainer.n_gpus_per_node=8
    - trainer.nnodes=1
    - trainer.save_freq=-1
    - trainer.test_freq=10000000
    - trainer.default_hdfs_dir=null
    - trainer.default_local_dir=output/models/replay_prob_temp_random_teacher_model_Qwen2.5-Math-1.5B_dataset_deepscaler_epoch_30_bs_512_lr_1e-6_beta_0_entropy_0_mu_2_tau_1e-3_alpha_0.5_sigma_0.5_buffer_512
    - trainer.total_epochs=30
    - trainer.resume_mode=auto
    - trainer.resume_from_path=final_checkpoints
    - +trainer.max_retries=1
    - +trainer.retry_delay=60
    - +data.random_selection=False
    - +teacher_model.embedding_path=adaptive_prediction_training
    - +teacher_model.model_name=Qwen/Qwen2.5-Math-1.5B-Instruct
    - +teacher_model.batch_size=32
    - +teacher_model.checkpoint_path=adaptive_prediction_training/adaptive_prediction_model.pt
    - +teacher_model.num_layers=3
    - +teacher_model.scaling=group_logit_temp
    - +teacher_model.hidden_size=896
  job:
    name: main_ppo
    chdir: null
    override_dirname: +actor_rollout_ref.actor.use_temp_log_prob=True,+data.alpha=0.5,+data.buffer_size=512,+data.mu=2,+data.random_selection=False,+data.ref_size=256,+data.replay_strategy=random,+data.sigma=0.5,+data.tau=1e-3,+teacher_model.batch_size=32,+teacher_model.checkpoint_path=adaptive_prediction_training/adaptive_prediction_model.pt,+teacher_model.embedding_path=adaptive_prediction_training,+teacher_model.hidden_size=896,+teacher_model.model_name=Qwen/Qwen2.5-Math-1.5B-Instruct,+teacher_model.num_layers=3,+teacher_model.scaling=group_logit_temp,+trainer.max_retries=1,+trainer.retry_delay=60,+trainer.val_before_train=False,actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.grad_offload=False,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.kl_loss_coef=0,actor_rollout_ref.actor.kl_loss_type=low_var_kl,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=11264,actor_rollout_ref.actor.ppo_mini_batch_size=64,actor_rollout_ref.actor.use_dynamic_bsz=True,actor_rollout_ref.actor.use_kl_loss=True,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=Qwen/Qwen2.5-Math-1.5B,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.7,actor_rollout_ref.rollout.n=8,actor_rollout_ref.rollout.n_val=8,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.temperature=0.6,actor_rollout_ref.rollout.tensor_model_parallel_size=1,actor_rollout_ref.rollout.val_temperature=0.6,algorithm.adv_estimator=grpo,data.max_prompt_length=1024,data.max_response_length=3072,data.train_batch_size=512,data.train_files=data/deepscaler.parquet,data.val_batch_size=512,data.val_files=data/deepscaler.parquet,trainer.critic_warmup=0,trainer.default_hdfs_dir=null,trainer.default_local_dir=output/models/replay_prob_temp_random_teacher_model_Qwen2.5-Math-1.5B_dataset_deepscaler_epoch_30_bs_512_lr_1e-6_beta_0_entropy_0_mu_2_tau_1e-3_alpha_0.5_sigma_0.5_buffer_512,trainer.experiment_name=replay_prob_temp_random_teacher_model_Qwen2.5-Math-1.5B_dataset_deepscaler_epoch_30_bs_512_lr_1e-6_beta_0_entropy_0_mu_2_tau_1e-3_alpha_0.5_sigma_0.5_buffer_512,trainer.logger=[console,wandb],trainer.n_gpus_per_node=8,trainer.nnodes=1,trainer.project_name=rl,trainer.resume_from_path=final_checkpoints,trainer.resume_mode=auto,trainer.save_freq=-1,trainer.test_freq=10000000,trainer.total_epochs=30
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/pbb/Project/Gradient-Streaming/archive/data-efficient-llm-rl-main/rl_training
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/pbb/Project/Gradient-Streaming/RLVR/rl_training/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/pbb/Project/Gradient-Streaming/archive/data-efficient-llm-rl-main/rl_training/outputs/2026-01-12/04-25-43
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
