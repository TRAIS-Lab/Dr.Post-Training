# GlobalSubset with a lazy target: the target rollouts (64 prompts x 8) are regenerated every 4 rounds and reused in
# between; 80 rounds; a checkpoint every 8 rounds (newest kept) so that a requeued job resumes where it stopped.
method: GlobalSubset
finetuning: Full
selection_frac: 1.0
val_loss_type: reward
refresh_freq: 4
total_training_steps: 80
save_freq: 8
resume_mode: auto
max_ckpt_keep: 1
exp_suffix: _rf4
