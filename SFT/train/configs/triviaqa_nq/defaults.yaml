# TriviaQA -> NQ-open closed-book QA
# Tests whether the dip-and-bounce dynamic is symmetric across (NQ <-> TriviaQA)
# pairing direction. Both train pool and target are short Q->A factoid pairs.
model: meta-llama/Llama-3.2-1B
train_dataset: triviaqa
target_task: nq_open
# TriviaQA train pool size = 138384. pct=0.05 ≈ 6919 samples; with bs=8 1 epoch → ~865 main steps
percentage: 0.05

seed: 42
batch_size: 8
gradient_accumulation_steps: 1
optim: adamw_torch
max_seq_length: 512
lr_scheduler_type: linear
warmup_ratio: 0.03
weight_decay: 0.0
num_train_epochs: 1
# eval_steps = 11 -> ~80 ppl points across ~865 steps
eval_steps: 11
use_flash_attention: true

n_eval: 500

selection_frac: 0.5
selection_mode: topk
n_val: 16
val_batch_size: 1
val_strategy: merged_batch
scoring:
  method: pip
