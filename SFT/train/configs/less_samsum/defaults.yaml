# Shared experiment defaults for LESS mixture → SamSUM

# Model
model: meta-llama/Llama-3.2-1B

# Dataset (LESS mixture is the default when no train_dataset is specified)
target_task: samsum
percentage: 0.05

# Training
seed: 42
batch_size: 8
gradient_accumulation_steps: 1
optim: adamw_torch
max_seq_length: 512
lr_scheduler_type: linear
warmup_ratio: 0.03
weight_decay: 0.0
num_train_epochs: 1
eval_steps: 50
use_flash_attention: true

# Evaluation
n_eval: 500

# Curation defaults
selection_frac: 0.5
n_val: 8
val_batch_size: 1
val_strategy: merged_batch
